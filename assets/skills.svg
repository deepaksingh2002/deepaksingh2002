<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"><defs></defs><rect x="1.0" y="1" width="318.0" height="258" rx="26" fill="#fff" stroke="#E2E5EE" stroke-width="1.5"/><rect x="28.0" y="28" width="48" height="48" rx="14" fill="#FDE8E5"/><rect x="41.0" y="42" width="22" height="16" rx="3" fill="none" stroke="#E5301F" stroke-width="2.5"/><path d="M46.0 64h12" stroke="#E5301F" stroke-width="2.5" stroke-linecap="round"/><text x="28.0" y="114" font-size="24" fill="#14171F" font-weight="800" text-anchor="start" letter-spacing="-0.5" >Frontend</text><text x="28.0" y="142" font-size="15" fill="#585F70" font-weight="400" text-anchor="start" letter-spacing="0" >React and Next.js interfaces with</text><text x="28.0" y="164" font-size="15" fill="#585F70" font-weight="400" text-anchor="start" letter-spacing="0" >clear state, fast loads and</text><text x="28.0" y="186" font-size="15" fill="#585F70" font-weight="400" text-anchor="start" letter-spacing="0" >layouts that hold up on a phone.</text><rect x="341.0" y="1" width="318.0" height="258" rx="26" fill="#fff" stroke="#E2E5EE" stroke-width="1.5"/><rect x="368.0" y="28" width="48" height="48" rx="14" fill="#FDE8E5"/><ellipse cx="392.0" cy="46" rx="12" ry="5" fill="none" stroke="#E5301F" stroke-width="2.5"/><path d="M380.0 46v14c0 3 5 5 12 5s12-2 12-5V46" fill="none" stroke="#E5301F" stroke-width="2.5"/><text x="368.0" y="114" font-size="24" fill="#14171F" font-weight="800" text-anchor="start" letter-spacing="-0.5" >Backend and data</text><text x="368.0" y="142" font-size="15" fill="#585F70" font-weight="400" text-anchor="start" letter-spacing="0" >Node and Express APIs, JWT role</text><text x="368.0" y="164" font-size="15" fill="#585F70" font-weight="400" text-anchor="start" letter-spacing="0" >access, MongoDB indexing and</text><text x="368.0" y="186" font-size="15" fill="#585F70" font-weight="400" text-anchor="start" letter-spacing=